<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companion Planting Recommender</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="../images/seedling-solid.svg" type="image/icon type">
    <script src="https://kit.fontawesome.com/9d1acc721d.js" crossorigin="anonymous"></script>
</head>
<body>
    <a href="../index.html" class="home-button">Home</a>
    <div class="container">
        <h1>Companion Planting Recommender</h1>
        <input type="text" id="plantInput" placeholder="Enter a plant name">
        <button onclick="getRecommendations()">Get Recommendations</button>
        
        <div id="results">
            <h2>Results</h2>
            <p id="plantsToPlant"></p>
            <p id="plantsToAvoid"></p>
            <p id="error"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
