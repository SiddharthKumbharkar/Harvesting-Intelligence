<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="images/seedling-solid.svg" type="image/icon type">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        body {
            background: url('images/farm-background.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            width: 800px;
            height: 500px;
            display: flex;
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        .form-container {
            width: 50%;
            padding: 60px;
            text-align: center;
        }
        .toggle-container {
            width: 50%;
            background: #2c5e1a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 100px 0 0 100px;
            transition: border-radius 0.5s ease-out;
        }
        .hidden {
            display: none;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            display: block;
            margin: 0 auto;
            padding: 12px;
            background: rgb(44, 94, 26);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #1b4d0f;
        }
        a {
            color: #2c5e1a;
            font-weight: bold;
        }
        .home-button {
            position: absolute;
            top: 25px;
            left: 20px;
            color: #2e7d32;
            background-color: #fff;
            opacity: 0.9;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }
        .home-button:hover {
            background: #2e7d32;
            color: #fff;
            box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-button">Home</a>
    <div class="container" id="container">
        <div class="form-container" id="signInContainer">
            <h2 style="color: rgb(44, 94, 26)">Sign In</h2>
            <form onsubmit="redirect_signin(event)">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Submit</button>
            </form>
            <p style="color: rgb(44, 94, 26)">Don't have an account? <a href="#" onclick="toggleForm()">Sign Up</a></p>
        </div>
        <div class="toggle-container" id="toggleText">
            Welcome Back!
        </div>
        <div class="form-container hidden" id="signUpContainer">
            <h2 style="color: rgb(44, 94, 26)">Sign Up</h2>
            <form id="authForm" onsubmit="toggleForm()">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="tel" name="contact" placeholder="Contact Number" required>
                <button type="submit">Submit</button>
            </form>
            <p style="color: rgb(44, 94, 26)">Already have an account? <a href="#" onclick="toggleForm()">Sign In</a></p>
        </div>
    </div>
    <script>
        function toggleForm() {
            const signInContainer = document.getElementById('signInContainer');
            const signUpContainer = document.getElementById('signUpContainer');
            const toggleText = document.getElementById('toggleText');
            
            if (signInContainer.classList.contains('hidden')) {
                signInContainer.classList.remove('hidden');
                signUpContainer.classList.add('hidden');
                toggleText.textContent = "Welcome Back!";
                toggleText.style.borderRadius = "100px 0 0 100px";
            } else {
                signInContainer.classList.add('hidden');
                signUpContainer.classList.remove('hidden');
                toggleText.textContent = "Welcome!";
                toggleText.style.borderRadius = "0 100px 100px 0";
            }
        }
        function redirect_signin(event){
            event.preventDefault();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
